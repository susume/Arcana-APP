<div class="screen ritual-screen ritual-screen-choice" id="screen-card-system">
  <div class="step-dots" id="dots-system"></div>
  <div class="progress-estimate" id="progress-card-system"></div>
  <h2>Choose your deck</h2>
  <p class="onboard compact-onboard">Use the deck in your hands. Arcana will keep its card names and meanings.</p>
  <button type="button" class="card-opt" aria-pressed="false" onclick="selectSystem('tarot',this)">
    <h3>Traditional Tarot</h3>
    <p>A 78-card tarot deck.<span class="card-system-detail"> Major and Minor Arcana, including Wands, Cups, Swords, and Pentacles.</span></p>
  </button>
  <button type="button" class="card-opt" aria-pressed="false" onclick="selectSystem('playing',this)">
    <h3>Playing Cards</h3>
    <p>A standard 52-card deck.<span class="card-system-detail"> Hearts, Diamonds, Clubs, and Spades, read through cartomancy meanings.</span></p>
  </button>
  <button type="button" class="card-opt" aria-pressed="false" onclick="selectSystem('playing-joker',this)">
    <h3>Playing Cards + Joker</h3>
    <p>A 52-card deck with one Joker.<span class="card-system-detail"> The Joker adds themes of possibility, surprise, and the unknown.</span></p>
  </button>
  <div class="nav-row">
    <button type="button" class="btn" onclick="goScreen('screen-concerns')">Back</button>
    <button class="btn btn-primary" onclick="confirmSystem()">Continue</button>
  </div>
</div>
