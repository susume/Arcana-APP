<div class="screen ritual-screen ritual-screen-choice" id="screen-card-system">
  <div class="step-dots" id="dots-system"></div>
  <div class="progress-estimate" id="progress-card-system"></div>
  <h2>Choose your deck</h2>
  <p class="onboard compact-onboard">Use the deck in your hands. Arcana will keep its card names and meanings.</p>
  <p class="reading-setup-summary" data-reading-setup hidden></p>
  <fieldset class="reading-options">
    <legend class="sr-only">Deck type</legend>
    <label class="card-opt selected">
      <span class="deck-display" aria-hidden="true"><span class="atlas-deck atlas-deck-tarot"><img src="assets/atlas/high-priestess.webp" alt="" width="419" height="720"></span></span>
      <span class="choice-title" id="deck-tarot-label">Traditional Tarot</span>
      <span class="choice-detail" id="deck-tarot-detail">A 78-card tarot deck.</span>
      <input type="radio" name="guided-deck" value="tarot" aria-labelledby="deck-tarot-label" aria-describedby="deck-tarot-detail" onchange="selectSystem(this.value)" checked>
    </label>
    <label class="card-opt">
      <span class="deck-display" aria-hidden="true"><span class="atlas-deck atlas-deck-playing"><b>A</b>♠</span></span>
      <span class="choice-title" id="deck-playing-label">Playing Cards</span>
      <span class="choice-detail" id="deck-playing-detail">A standard 52-card deck.</span>
      <input type="radio" name="guided-deck" value="playing" aria-labelledby="deck-playing-label" aria-describedby="deck-playing-detail" onchange="selectSystem(this.value)">
    </label>
    <label class="card-opt">
      <span class="deck-display" aria-hidden="true"><span class="atlas-deck atlas-deck-joker"><b>J</b>✦</span></span>
      <span class="choice-title" id="deck-joker-label">Playing Cards + Joker</span>
      <span class="choice-detail" id="deck-joker-detail">A 52-card deck with one Joker.</span>
      <input type="radio" name="guided-deck" value="playing-joker" aria-labelledby="deck-joker-label" aria-describedby="deck-joker-detail" onchange="selectSystem(this.value)">
    </label>
  </fieldset>
  <div class="nav-row">
    <button type="button" class="btn" onclick="goScreen('screen-spread')">Back</button>
    <button type="button" class="btn btn-primary" onclick="confirmSystem()">Continue to card entry</button>
  </div>
</div>
