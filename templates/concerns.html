<div class="screen ritual-screen ritual-screen-focus" id="screen-concerns">
  <div class="step-dots" id="dots-concerns"></div>
  <div class="progress-estimate" id="progress-concerns"></div>
  <h2>What would you like to reflect on?</h2>
  <p class="onboard compact-onboard">One question is enough. You can also continue with an open reading.</p>
  <div id="concern-list">
    <div class="concern-row"><label for="concern-input-1">Your question (optional)</label><input id="concern-input-1" type="text" maxlength="1000" placeholder="What is on your mind?" class="concern-input"></div>
  </div>
  <button type="button" class="btn btn-sm flow-shortcut" onclick="skipConcerns()">Skip question</button>
  <details class="flow-details question-ideas">
    <summary>Need a starting point?</summary>
    <div class="tag-chips">
    <button type="button" class="tag-chip" onclick="tagConcern(this)">Career</button>
    <button type="button" class="tag-chip" onclick="tagConcern(this)">Personal Growth</button>
    <button type="button" class="tag-chip" onclick="tagConcern(this)">General Guidance</button>
    </div>
  </details>
  <div class="nav-row">
    <button type="button" class="btn" onclick="goScreen('screen-welcome')">Back</button>
    <button class="btn btn-primary" onclick="saveConcerns()">Continue</button>
  </div>
</div>
